<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ recipe.name }} · Meal Planner</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  <link rel="stylesheet" href="/static/styles.css?v=20260809v5" />
  <!-- Zonder defer: het inline script onderaan de body draait tijdens het parsen
       en heeft RecipeView dan al nodig. -->
  <script src="/static/recipe-view.js?v=20260809v5"></script>
</head>
<body class="detail-page">
  <main class="detail-shell">
    <header class="card detail-top">
      <a href="/" class="btn">Terug naar planner</a>
      <div class="detail-top-actions">
        <span class="course-pill course-{{ recipe.course or 'hoofdgerecht' }}">{{ course_label }}</span>
        {% if recipe.source_url %}
          <a class="source-pill source-pill-link" href="{{ recipe.source_url }}"
             target="_blank" rel="noopener noreferrer"
             title="Bekijk het originele recept">{{ source_label }}</a>
        {% else %}
          <span class="source-pill">{{ source_label }}</span>
        {% endif %}
        <button
          id="detail-edit-btn"
          class="btn btn-primary"
          type="button"
          {% if not editable %}disabled title="Alleen eigen gerechten zijn bewerkbaar"{% endif %}
        >Bewerken</button>
        <span class="user-pill">{{ user.name }}</span>
      </div>
    </header>

    <form
      id="detail-form"
      class="detail-edit-form"
      data-meal-id="{{ meal_id }}"
      data-editable="{{ '1' if editable else '0' }}"
      data-rating="{{ recipe.rating or 3 }}"
      data-servings="{{ servings }}"
    >
      <section class="card detail-hero">
        <div class="detail-media-column">
          <img id="detail-image" src="{{ meal_image }}" alt="{{ recipe.name }}" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=1200&q=80';" />
          <input id="detail-photo-file" type="file" accept="image/*" hidden />
          <div class="detail-photo-actions">
            <button
              id="detail-photo-upload-btn"
              class="btn btn-primary"
              type="button"
              {% if not editable %}disabled title="Alleen eigen gerechten zijn bewerkbaar"{% endif %}
            >Eigen foto uploaden</button>
          </div>
          <div class="detail-rating-wrap" aria-label="Gerecht rating">
            <div class="detail-rating-label">Rating</div>
            <div id="detail-rating-stars" class="detail-rating-stars" role="radiogroup" aria-label="Rating 1 tot 5 sterren"></div>
            <div id="detail-rating-note" class="muted">Meer sterren = vaker in weekmenu.</div>
          </div>
        </div>
        <div class="detail-form-grid">
          <label>Naam <input id="f-name" type="text" value="{{ recipe.name }}" disabled /></label>
          <label>Beschrijving <input id="f-description" type="text" value="{{ recipe.description or '' }}" disabled /></label>
          <label>Foto URL <input id="f-image-url" type="url" value="{{ recipe.image_url or '' }}" disabled /></label>
          <div class="detail-inline">
            <label>Proteine (g) <input id="f-protein" type="number" min="0" value="{{ recipe.nutrition.protein or 0 }}" disabled /></label>
            <label>Koolhydraten (g) <input id="f-carbs" type="number" min="0" value="{{ recipe.nutrition.carbs or 0 }}" disabled /></label>
            <label>Calorieen <input id="f-calories" type="number" min="0" value="{{ recipe.nutrition.calories or 0 }}" disabled /></label>
          </div>
          <div class="detail-inline">
            <label>Tags (komma) <input id="f-tags" type="text" value="{{ (recipe.tags or [])|join(', ') }}" disabled /></label>
            <label>Allergenen (komma) <input id="f-allergens" type="text" value="{{ (recipe.allergens or [])|join(', ') }}" disabled /></label>
            <label>Gang
              <select id="f-course" disabled>
                <option value="voorgerecht" {% if recipe.course == 'voorgerecht' %}selected{% endif %}>Voorgerecht</option>
                <option value="hoofdgerecht" {% if recipe.course != 'voorgerecht' and recipe.course != 'dessert' %}selected{% endif %}>Hoofdgerecht</option>
                <option value="dessert" {% if recipe.course == 'dessert' %}selected{% endif %}>Dessert</option>
              </select>
            </label>
            <label>Rotatiefrequentie
              <select id="f-rotation" disabled>
                <option value="1_per_week" {% if recipe.rotation_limit == '1_per_week' %}selected{% endif %}>1 keer per week</option>
                <option value="1_per_2_weeks" {% if recipe.rotation_limit == '1_per_2_weeks' %}selected{% endif %}>1 keer per 2 weken</option>
                <option value="1_per_month" {% if recipe.rotation_limit == '1_per_month' %}selected{% endif %}>1 keer per maand</option>
                <option value="1_per_2_months" {% if recipe.rotation_limit == '1_per_2_months' %}selected{% endif %}>1 keer per 2 maanden</option>
              </select>
            </label>
          </div>
          {% if date_label %}
            <p class="muted">Gepland op: {{ date_label }}</p>
          {% endif %}
          <span id="detail-save-status" class="muted"></span>
        </div>
      </section>

      <section class="detail-grid">
        <article class="card detail-card">
          <div class="detail-card-head">
            <h3>Ingredienten</h3>
            <div class="servings-block">
              <span class="servings-caption">Voor</span>
              <div id="detail-servings"></div>
            </div>
          </div>

          <p id="servings-hint" class="muted servings-hint"></p>

          <!-- Bekijken: nette tabel. Bewerken: platte tekst. -->
          <div id="ingredients-view" class="ingredients-view"></div>
          <label id="ingredients-edit" class="edit-only" hidden>
            <span class="edit-help">1 ingredient per lijn: <code>naam, aantal, eenheid</code></span>
            <textarea id="f-ingredients" class="detail-textarea-rich" rows="12" disabled>{% for ing in recipe.ingredients or [] %}{{ ing.name }}, {{ ing.quantity }}, {{ ing.unit }}{% if not loop.last %}
{% endif %}{% endfor %}</textarea>
          </label>
        </article>

        <article class="card detail-card">
          <h3>Bereidingswijze</h3>

          <div id="preparation-view" class="preparation-view"></div>
          <label id="preparation-edit" class="edit-only" hidden>
            <span class="edit-help">
              Laat een <strong>lege regel</strong> tussen twee stappen; die worden automatisch
              genummerd. Eigen titel met <code>## Titel</code>, opsomming met <code>-</code>,
              nadruk met <code>**vet**</code>.
            </span>
            <textarea id="f-preparation" class="detail-textarea-rich" rows="14" disabled>{% for step in steps %}{{ step }}{% if not loop.last %}

{% endif %}{% endfor %}</textarea>
          </label>
        </article>
      </section>
    </form>
  </main>

  <script>
    (function () {
      const form = document.getElementById("detail-form");
      const editBtn = document.getElementById("detail-edit-btn");
      const status = document.getElementById("detail-save-status");
      const image = document.getElementById("detail-image");
      const imageUrlInput = document.getElementById("f-image-url");
      const photoFileInput = document.getElementById("detail-photo-file");
      const uploadBtn = document.getElementById("detail-photo-upload-btn");
      const starsWrap = document.getElementById("detail-rating-stars");
      const ratingNote = document.getElementById("detail-rating-note");
      if (!form || !editBtn) return;

      const editable = form.dataset.editable === "1";
      let editing = false;
      let rating = Math.max(1, Math.min(5, Number(form.dataset.rating || 3)));

      const RV = window.RecipeView;
      const ingredientsInput = document.getElementById("f-ingredients");
      const preparationInput = document.getElementById("f-preparation");
      const ingredientsView = document.getElementById("ingredients-view");
      const preparationView = document.getElementById("preparation-view");
      const ingredientsEdit = document.getElementById("ingredients-edit");
      const preparationEdit = document.getElementById("preparation-edit");
      const servingsHint = document.getElementById("servings-hint");

      // Porties waarvoor het recept genoteerd is, en waarvoor je nu wil koken.
      const baseServings = RV.clampServings(form.dataset.servings, RV.DEFAULT_SERVINGS);
      let viewServings = baseServings;

      const stepper = RV.createServingsStepper({
        value: baseServings,
        onChange: (value) => {
          viewServings = value;
          renderReadOnly();
        },
      });
      document.getElementById("detail-servings").appendChild(stepper.element);

      function splitCsv(value) {
        return (value || "").split(",").map((x) => x.trim().toLowerCase()).filter(Boolean);
      }

      function renderReadOnly() {
        const ingredients = RV.parseIngredients(ingredientsInput.value);
        const scale = viewServings / baseServings;
        ingredientsView.innerHTML = RV.renderIngredientsTable(ingredients, scale);
        preparationView.innerHTML = RV.renderSteps(RV.parseSteps(preparationInput.value));

        if (viewServings === baseServings) {
          servingsHint.textContent = `Hoeveelheden zoals genoteerd, voor ${baseServings} personen.`;
        } else {
          servingsHint.textContent =
            `Omgerekend van ${baseServings} naar ${viewServings} ` +
            `${viewServings === 1 ? "persoon" : "personen"}.`;
        }
      }

      function setEditing(next) {
        editing = next;
        const fields = form.querySelectorAll("input, textarea, select");
        fields.forEach((field) => {
          if (field.id === "detail-photo-file") return;
          field.disabled = !editing;
        });

        // In bewerkmodus schrijf je platte tekst, daarbuiten lees je de nette weergave.
        ingredientsEdit.hidden = !editing;
        preparationEdit.hidden = !editing;
        ingredientsView.hidden = editing;
        preparationView.hidden = editing;

        if (editing) {
          // Bij bewerken tonen we altijd de opgeslagen hoeveelheden, niet de omgerekende.
          stepper.value = baseServings;
        } else {
          renderReadOnly();
        }

        editBtn.textContent = editing ? "Opslaan" : "Bewerken";
      }

      function renderStars() {
        if (!starsWrap) return;
        starsWrap.innerHTML = "";
        for (let i = 1; i <= 5; i += 1) {
          const star = document.createElement("button");
          star.type = "button";
          star.className = "detail-star-btn" + (i <= rating ? " active" : "");
          star.textContent = "★";
          star.setAttribute("aria-label", `${i} sterren`);
          star.setAttribute("aria-checked", String(i === rating));
          if (!editable) {
            star.disabled = true;
          }
          star.addEventListener("click", () => {
            if (!editable) return;
            setRating(i);
          });
          starsWrap.appendChild(star);
        }
      }

      async function setRating(nextRating) {
        rating = Math.max(1, Math.min(5, Number(nextRating || 3)));
        renderStars();
        if (!editable) return;
        try {
          const res = await fetch(`/api/custom-meals/${encodeURIComponent(form.dataset.mealId)}/rating`, {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ rating }),
          });
          if (!res.ok) throw new Error("save-failed");
          ratingNote.textContent = `Rating opgeslagen: ${rating}/5`;
          setTimeout(() => { ratingNote.textContent = "Meer sterren = vaker in weekmenu."; }, 1400);
        } catch (_) {
          ratingNote.textContent = "Rating opslaan mislukt.";
        }
      }

      async function uploadPhoto(file) {
        const body = new FormData();
        body.append("photo", file);
        const res = await fetch(`/api/custom-meals/${encodeURIComponent(form.dataset.mealId)}/photo`, {
          method: "POST",
          body,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          status.textContent = data.error || "Foto uploaden mislukt.";
          return;
        }
        if (data.image_url) {
          image.src = data.image_url;
          imageUrlInput.value = data.image_url;
          status.textContent = "Foto geupload.";
        }
      }

      imageUrlInput.addEventListener("input", () => {
        const value = imageUrlInput.value.trim();
        if (value) image.src = value;
      });

      if (uploadBtn && photoFileInput) {
        uploadBtn.addEventListener("click", () => {
          if (!editable) return;
          photoFileInput.click();
        });
        photoFileInput.addEventListener("change", async () => {
          const file = photoFileInput.files && photoFileInput.files[0];
          if (!file) return;
          await uploadPhoto(file);
          photoFileInput.value = "";
        });
      }

      editBtn.addEventListener("click", async () => {
        if (!editable) return;
        if (!editing) {
          setEditing(true);
          return;
        }

        const payload = {
          name: document.getElementById("f-name").value.trim(),
          description: document.getElementById("f-description").value.trim(),
          image_url: document.getElementById("f-image-url").value.trim(),
          protein: Number(document.getElementById("f-protein").value || 0),
          carbs: Number(document.getElementById("f-carbs").value || 0),
          calories: Number(document.getElementById("f-calories").value || 0),
          tags: splitCsv(document.getElementById("f-tags").value),
          allergens: splitCsv(document.getElementById("f-allergens").value),
          ingredients: RV.parseIngredients(ingredientsInput.value),
          preparation: RV.parseSteps(preparationInput.value),
          rotation_limit: document.getElementById("f-rotation").value,
          course: document.getElementById("f-course").value,
          servings: stepper.value,
          rating,
        };

        const res = await fetch(`/api/custom-meals/${encodeURIComponent(form.dataset.mealId)}`, {
          method: "PUT",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          status.textContent = "Opslaan mislukt.";
          return;
        }

        status.textContent = "Opgeslagen.";
        // Opnieuw laden zodat de omgerekende weergave vanaf de nieuwe porties vertrekt.
        window.location.reload();
      });

      renderStars();
      setEditing(false);
    })();
  </script>
</body>
</html>
