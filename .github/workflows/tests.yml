name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Show environment
        run: |
          python --version
          pip --version
          python -c "import flask, dotenv, werkzeug; print('app deps ok')"
          python -c "import pytest; print('pytest', pytest.__version__)"

      # De live smoke test vereist een draaiende app en credentials en wordt
      # daarom bewust overgeslagen; die draai je lokaal of tegen productie.
      #
      # De output gaat ook naar de run-samenvatting. Logs van Actions zijn niet
      # zonder inloggen te lezen, en dan is een rood kruisje zonder reden niet
      # te debuggen: de samenvatting is wel publiek opvraagbaar.
      - name: Run unit tests
        id: pytest
        run: |
          set -o pipefail
          pytest -m "not live" -v --tb=short 2>&1 | tee pytest-output.txt

      - name: Publish results
        if: always()
        run: |
          {
            echo "## Testresultaten"
            echo
            echo '```'
            tail -60 pytest-output.txt 2>/dev/null || echo "geen output vastgelegd"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # De samenvatting is niet zonder inloggen op te vragen, annotaties wel.
      # Bij een rode build staat de reden daardoor altijd in de check-run.
      - name: Report failure as annotation
        if: failure()
        run: |
          MSG=$(tail -40 pytest-output.txt 2>/dev/null || echo "geen pytest-output vastgelegd")
          MSG="${MSG//'%'/'%25'}"
          MSG="${MSG//$'\n'/'%0A'}"
          MSG="${MSG//$'\r'/'%0D'}"
          echo "::error title=pytest::$MSG"
