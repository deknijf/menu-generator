name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # De live smoke test vereist een draaiende app en credentials en wordt
      # daarom bewust overgeslagen; die draai je lokaal of tegen productie.
      - name: Run unit tests
        run: pytest -m "not live"
