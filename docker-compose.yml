services:
  menu-generator:
    image: deknijf/menu-generator:v0.4.0
    container_name: menu-generator
    restart: unless-stopped
    ports:
      # Host 8001, niet 8000: op de productieserver draait documentstore al op
      # 8000, en de nginx vhost voor menu.deknijf.eu proxyt naar 127.0.0.1:8001.
      # Wijzig dit niet zonder ook de vhost aan te passen.
      - "8001:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      # De admin-UI schrijft de OpenRouter-configuratie naar /app/.env. Zonder
      # deze mount staat dat bestand alleen in de container en is de API-key weg
      # na elke `docker compose pull`. Het bestand moet op de host bestaan voordat
      # de stack start, anders maakt Docker er een directory van.
      - ./.env:/app/.env
