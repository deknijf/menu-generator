[pytest]
testpaths = tests
python_files = test_*.py
# Zet de repo-root op sys.path zodat "from app import ..." werkt. Zonder dit
# hangt het af van hoe je pytest start: "python -m pytest" voegt de huidige map
# zelf toe, het kale "pytest"-commando niet. Dat verschil liet de tests lokaal
# slagen en in CI falen met ModuleNotFoundError.
pythonpath = .
addopts = -q --strict-markers
markers =
    live: smoke test tegen een draaiende app (vereist MP_EMAIL/MP_PASS, wordt anders overgeslagen)
